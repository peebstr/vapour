[package]
name = "vapour"
version = "0.0.1-alpha.1"
edition = "2021"
authors = ["pb"]
license = "MIT"
description = "Lightweight native Steam game launcher & lifecycle controller for Linux"

[dependencies]
inquire = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = { version = "3.4", features = ["termination"] }
libc = "0.2"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.5"
tempfile = "3.27"
